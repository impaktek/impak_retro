name: impak_retro
description: "ImpakRetro is a Dart library built on Dio, offering a type-safe, configurable, and user-friendly interface for handling HTTP requests and interacting with APIs."
version: 2.1.2
homepage: https://github.com/impaktek/impak_retro

environment:
  sdk: '>=3.0.0 <4.0.0'

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  logger: ^2.7.0
  http_parser: ^4.1.2
  os_mime_type: ^0.0.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  mockito: ^5.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0

dependency_overrides:
  test_api: ^0.7.13

flutter:
  uses-material-design: true
